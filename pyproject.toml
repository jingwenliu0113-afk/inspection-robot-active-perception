[project]
name = "inspection-active-perception"
version = "0.1.0"
description = "Active perception under a fixed viewpoint budget: present / absent / inconclusive inspection (ROS 2 Jazzy + Gazebo Harmonic)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
detectors = [
    "torch>=2.11",
    "torchvision>=0.26",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["activeperception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# XML templates: long literal lines are clearer than wrapped f-strings
"activeperception/sim/sdf.py" = ["E501"]
"activeperception/nav/world.py" = ["E501"]
"activeperception/nav/robot.py" = ["E501"]
