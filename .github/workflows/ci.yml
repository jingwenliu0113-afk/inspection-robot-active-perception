# Lightweight CI: no Docker, no GPU, no detector weights.
# Gazebo / Nav2 runs and detector inference are reproduced locally (docs/reproduce.md);
# CI checks lint, the sealed results and the test suite (which also regenerates the committed
# episode specs from their seeds: bit for bit on macOS arm64, within 4 ulp on Linux).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes exact tags only
        with:
          enable-cache: true

      - name: Install (Python 3.12, numpy, pytest, ruff, matplotlib; no detectors extra)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Sealed results and frozen configs unchanged
        run: uv run python -m activeperception.seal verify

      - name: Tests (1 test is skipped without local renders)
        run: uv run pytest -q -rs
